<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>화장실 인테리어 견적서 자동생성</title>
<style>
  :root {
    --accent: #1d6f5c;
    --accent-dark: #12463a;
    --bg: #f4f6f5;
    --card: #ffffff;
    --border: #e2e6e4;
    --text: #1f2a27;
    --muted: #6b7873;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    font-size: 16px;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 14px 100px;
    background: var(--bg);
    color: var(--text);
  }
  header.page-head { margin-bottom: 24px; }
  header.page-head h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header.page-head .sub { color: var(--muted); font-size: 13.5px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(20, 40, 35, 0.04);
  }
  .card h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,111,92,0.12); }

  .catalog { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .catalog button {
    font-size: 13.5px;
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fafcfb;
    border-radius: 999px;
    cursor: pointer;
    color: var(--text);
  }
  .catalog button:active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .chip-wrap { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; }
  .chip-wrap.custom .cat-btn { border-color: #cfe0da; background: #f2f8f5; }
  .chip-wrap .cat-del {
    border: 1px solid var(--border);
    border-left: none;
    background: #fafcfb;
    color: #b94a48;
    font-size: 15px;
    min-width: 44px;
    cursor: pointer;
    border-radius: 0 999px 999px 0;
  }
  .chip-wrap .cat-btn { border-radius: 999px 0 0 999px; }
  .chip-wrap .cat-edit {
    border: 1px solid var(--border);
    border-left: none;
    background: #fafcfb;
    color: #3b6f82;
    font-size: 13px;
    min-width: 44px;
    cursor: pointer;
  }

  .add-catalog-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .add-catalog-form input { width: auto; flex: 1 1 110px; }
  .add-catalog-form button {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 8px 16px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  /* ===== 담은 품목: 모바일 카드 목록 ===== */
  .items-list { display: flex; flex-direction: column; gap: 12px; }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 28px 12px;
    font-size: 14.5px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .item-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    background: #fff;
  }
  .item-card-row1 { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .item-name-input {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
  }
  .card-del-btn {
    flex-shrink: 0;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid #e3b8b6;
    background: #fdf3f2;
    color: #b94a48;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .item-card-row2 { display: flex; gap: 8px; margin-bottom: 12px; }
  .item-card-row2 input { font-size: 14.5px; padding: 9px; flex: 1; }
  .item-card-row3 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .qty-stepper {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .stepper-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: #f2f6f4;
    color: var(--accent-dark);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stepper-btn:active { background: var(--accent); color: #fff; }
  .qty-display {
    min-width: 46px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .price-field { display: flex; align-items: center; gap: 8px; }
  .price-field label { margin: 0; font-size: 13px; color: var(--muted); }
  .item-price-input {
    width: 120px;
    font-size: 16px;
    padding: 10px 8px;
    text-align: right;
  }
  .item-card-amount {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .item-card-amount span { font-size: 13px; color: var(--muted); }
  .item-card-amount strong {
    font-size: 19px;
    font-variant-numeric: tabular-nums;
    color: var(--accent-dark);
  }

  .undo-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #1f2a27;
    color: #fff;
    padding: 10px 10px 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
    max-width: calc(100% - 32px);
  }
  .undo-toast button {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #7fd8bd;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 999px;
  }

  .add-row-btn {
    margin-top: 10px;
    min-height: 44px;
    width: 100%;
    padding: 8px 14px;
    border: 1px dashed #b9c4bf;
    background: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
  }

  .rates-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .rate-inline { display: flex; align-items: center; gap: 8px; }
  .rate-inline label { margin: 0; font-size: 14px; color: var(--text); }
  .rate-inline input { width: 72px; }

  .totals-card {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    border: none;
  }
  .totals-card h2 { color: rgba(255,255,255,0.85); }
  .totals div.line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14.5px; color: rgba(255,255,255,0.85); }
  .totals .grand {
    font-weight: 700;
    font-size: 21px;
    color: #fff;
    border-top: 1px solid rgba(255,255,255,0.25);
    margin-top: 8px;
    padding-top: 10px;
  }

  .actions { margin-top: 6px; display: flex; gap: 10px; }
  .actions button {
    min-height: 48px;
    width: 100%;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }

  .notes { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.7; }
</style>
</head>
<body>
  <header class="page-head">
    <h1>화장실 인테리어 견적서 자동생성</h1>
    <div class="sub">품목을 고르고 수량을 조절하면 부가세·계약금까지 바로 계산됩니다.</div>
  </header>

  <div class="card">
    <h2>공급자 정보 (우리 업체)</h2>
    <div class="meta-grid">
      <div><label>업체명</label><input id="supplierName" /></div>
      <div><label>대표자</label><input id="supplierRep" /></div>
      <div><label>연락처</label><input id="supplierContact" /></div>
      <div><label>입금 계좌</label><input id="supplierAccount" /></div>
    </div>
  </div>

  <div class="card">
    <h2>현장 정보</h2>
    <div class="meta-grid">
      <div><label>거래처명</label><input id="clientName" /></div>
      <div><label>연락처</label><input id="contact" /></div>
      <div><label>현장주소</label><input id="siteAddress" /></div>
      <div><label>상담일자</label><input id="consultDate" type="date" /></div>
      <div><label>시공예정일</label><input id="workDate" type="date" /></div>
    </div>
  </div>

  <div class="card">
    <h2>자주 쓰는 품목 (누르면 담기고, 같은 품목을 또 누르면 수량이 올라갑니다)</h2>
    <div class="catalog" id="catalog"></div>
    <div class="add-catalog-form">
      <input id="newItemName" placeholder="품명" />
      <input id="newItemSpec" placeholder="규격" />
      <input id="newItemUnit" placeholder="단위" value="EA" />
      <input id="newItemPrice" type="number" placeholder="단가" />
      <button id="addCatalogItemBtn">+ 자주 쓰는 품목으로 저장</button>
      <button id="cancelEditBtn" type="button" style="display:none; background:none; border:1px solid var(--border); color: var(--muted); border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; min-height:44px;">취소</button>
    </div>
    <div class="notes" style="margin-top:8px">※ 새로 등록/수정/삭제한 내용은 이 컴퓨터의 이 브라우저에만 저장됩니다.</div>
  </div>

  <div class="card">
    <h2>담은 품목</h2>
    <div class="items-list" id="itemsList"></div>
    <button class="add-row-btn" id="addRowBtn">+ 새 품목 직접 넣기</button>
  </div>

  <div class="card">
    <h2>요율</h2>
    <div class="rates-row">
      <div class="rate-inline"><label>부가세</label><input id="vatRate" type="number" value="10" /> %</div>
      <div class="rate-inline"><label>계약금</label><input id="depositRate" type="number" value="50" /> %</div>
    </div>
  </div>

  <div class="card totals-card">
    <h2>견적 요약</h2>
    <div class="totals" id="totals"></div>
  </div>

  <div class="actions">
    <button id="downloadBtn">엑셀 견적서 다운로드</button>
  </div>

  <div class="notes" id="notesArea"></div>

  <div class="undo-toast" id="undoToast" style="display:none">
    <span id="undoToastText"></span>
    <button id="undoToastBtn">되돌리기</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
