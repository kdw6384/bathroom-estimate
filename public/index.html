<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>화장실 인테리어 견적서 자동생성</title>
<style>
  :root {
    --accent: #1d6f5c;
    --accent-dark: #12463a;
    --bg: #f4f6f5;
    --card: #ffffff;
    --border: #e2e6e4;
    --text: #1f2a27;
    --muted: #6b7873;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    background: var(--bg);
    color: var(--text);
  }
  header.page-head { margin-bottom: 28px; }
  header.page-head h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header.page-head .sub { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(20, 40, 35, 0.04);
  }
  .card h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,111,92,0.12); }

  .catalog { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .catalog button {
    font-size: 12.5px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: #fafcfb;
    border-radius: 999px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.12s ease;
  }
  .catalog button:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-1px); }

  .chip-wrap { display: inline-flex; align-items: center; border-radius: 999px; overflow: hidden; }
  .chip-wrap.custom .cat-btn { border-color: #cfe0da; background: #f2f8f5; }
  .chip-wrap .cat-del {
    border: 1px solid var(--border);
    border-left: none;
    background: #fafcfb;
    color: #b94a48;
    font-size: 11px;
    padding: 7px 9px;
    cursor: pointer;
    border-radius: 0 999px 999px 0;
  }
  .chip-wrap .cat-del:hover { background: #fdeceb; }
  .chip-wrap .cat-btn { border-radius: 999px 0 0 999px; }
  .chip-wrap .cat-edit {
    border: 1px solid var(--border);
    border-left: none;
    background: #fafcfb;
    color: #3b6f82;
    font-size: 11px;
    padding: 7px 8px;
    cursor: pointer;
  }
  .chip-wrap .cat-edit:hover { background: #eaf2f5; }

  .add-catalog-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .add-catalog-form input { width: auto; flex: 1 1 110px; }
  .add-catalog-form button {
    flex: 0 0 auto;
    padding: 8px 14px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .add-catalog-form button:hover { background: var(--accent); color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #eef3f1;
    color: var(--accent-dark);
    font-weight: 700;
    padding: 8px 6px;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
  }
  td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: center; }
  tbody tr:nth-child(even) { background: #fafbfa; }
  tbody tr:hover { background: #f0f6f3; }
  td input { border: none; background: transparent; padding: 6px 4px; text-align: center; }
  td.name-cell input { text-align: left; }
  td input:focus { background: #fff; border-radius: 4px; box-shadow: 0 0 0 2px rgba(29,111,92,0.15); }
  .amount-cell { text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; }

  .row-actions button {
    border: none;
    background: none;
    color: #b94a48;
    cursor: pointer;
    font-size: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
  }
  .row-actions button:hover { background: #fdeceb; }

  .add-row-btn {
    margin-top: 10px;
    padding: 8px 14px;
    border: 1px dashed #b9c4bf;
    background: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); }

  .rates-row { display: flex; gap: 28px; }
  .rate-inline { display: flex; align-items: center; gap: 6px; }
  .rate-inline label { margin: 0; font-size: 13px; color: var(--text); }
  .rate-inline input { width: 64px; }

  .totals-card {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    border: none;
  }
  .totals-card h2 { color: rgba(255,255,255,0.85); }
  .totals div.line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; color: rgba(255,255,255,0.85); }
  .totals .grand {
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    border-top: 1px solid rgba(255,255,255,0.25);
    margin-top: 8px;
    padding-top: 10px;
  }

  .actions { margin-top: 6px; display: flex; gap: 10px; }
  .actions button {
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: background 0.12s ease;
  }
  .actions button:hover { background: var(--accent-dark); }

  .notes { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.7; }
</style>
</head>
<body>
  <header class="page-head">
    <h1>화장실 인테리어 견적서 자동생성</h1>
    <div class="sub">품목을 고르고 수량을 입력하면 부가세·계약금까지 자동 계산됩니다.</div>
  </header>

  <div class="card">
    <h2>공급자 정보 (우리 업체)</h2>
    <div class="meta-grid">
      <div><label>업체명</label><input id="supplierName" /></div>
      <div><label>대표자</label><input id="supplierRep" /></div>
      <div><label>연락처</label><input id="supplierContact" /></div>
      <div><label>입금 계좌</label><input id="supplierAccount" /></div>
    </div>
  </div>

  <div class="card">
    <h2>현장 정보</h2>
    <div class="meta-grid">
      <div><label>거래처명</label><input id="clientName" /></div>
      <div><label>연락처</label><input id="contact" /></div>
      <div><label>현장주소</label><input id="siteAddress" /></div>
      <div><label>상담일자</label><input id="consultDate" type="date" /></div>
      <div><label>시공예정일</label><input id="workDate" type="date" /></div>
    </div>
  </div>

  <div class="card">
    <h2>자주 쓰는 품목 (클릭하면 표에 추가, 같은 품목을 다시 누르면 수량이 올라갑니다)</h2>
    <div class="catalog" id="catalog"></div>
    <div class="add-catalog-form">
      <input id="newItemName" placeholder="품명" />
      <input id="newItemSpec" placeholder="규격" />
      <input id="newItemUnit" placeholder="단위" value="EA" />
      <input id="newItemPrice" type="number" placeholder="단가" />
      <button id="addCatalogItemBtn">+ 자주 쓰는 품목으로 저장</button>
      <button id="cancelEditBtn" type="button" style="display:none; background:none; border:1px solid var(--border); color: var(--muted); border-radius:6px; padding:8px 14px; font-size:13px; cursor:pointer;">취소</button>
    </div>
    <div class="notes" style="margin-top:8px">※ 새로 등록/수정/삭제한 내용은 이 컴퓨터의 이 브라우저에만 저장됩니다.</div>
  </div>

  <div class="card">
    <h2>견적 항목</h2>
    <table id="itemsTable">
      <thead>
        <tr><th>품명</th><th>규격</th><th>단위</th><th>수량</th><th>단가</th><th>금액</th><th></th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button class="add-row-btn" id="addRowBtn">+ 품목 직접 추가</button>
  </div>

  <div class="card">
    <h2>요율</h2>
    <div class="rates-row">
      <div class="rate-inline"><label>부가세</label><input id="vatRate" type="number" value="10" /> %</div>
      <div class="rate-inline"><label>계약금</label><input id="depositRate" type="number" value="50" /> %</div>
    </div>
  </div>

  <div class="card totals-card">
    <h2>견적 요약</h2>
    <div class="totals" id="totals"></div>
  </div>

  <div class="actions">
    <button id="downloadBtn">엑셀 견적서 다운로드</button>
  </div>

  <div class="notes" id="notesArea"></div>

  <script src="app.js"></script>
</body>
</html>
