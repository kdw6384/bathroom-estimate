<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>화장실 인테리어 견적서 자동생성</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  legend { font-weight: bold; padding: 0 6px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 2px; }
  input, select { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: center; }
  th { background: #f5f5f5; }
  td input { border: none; padding: 4px; text-align: center; }
  td.name-cell input { text-align: left; }
  .amount-cell { text-align: right; padding-right: 8px; }
  .catalog { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .catalog button { font-size: 12px; padding: 4px 8px; border: 1px solid #bbb; background: #fafafa; border-radius: 14px; cursor: pointer; }
  .catalog button:hover { background: #eee; }
  .row-actions button { border: none; background: none; color: #c33; cursor: pointer; font-size: 14px; }
  .add-row-btn { margin-top: 8px; padding: 6px 12px; border: 1px dashed #999; background: none; border-radius: 4px; cursor: pointer; }
  .totals { margin-top: 12px; font-size: 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
  .totals .grand { font-weight: bold; font-size: 16px; border-top: 1px solid #333; margin-top: 4px; padding-top: 6px; }
  .actions { margin-top: 20px; display: flex; gap: 8px; }
  .actions button { padding: 10px 20px; font-size: 14px; border-radius: 6px; border: 1px solid #333; cursor: pointer; background: #222; color: #fff; }
  .notes { font-size: 11px; color: #888; margin-top: 16px; line-height: 1.6; }
  .rate-inline { display: flex; align-items: center; gap: 4px; }
  .rate-inline input { width: 60px; }
</style>
</head>
<body>
  <h1>화장실 인테리어 견적서 자동생성</h1>
  <div class="sub">품목을 고르고 수량을 입력하면 부가세·계약금까지 자동 계산됩니다.</div>

  <fieldset>
    <legend>현장 정보</legend>
    <div class="meta-grid">
      <div><label>거래처명</label><input id="clientName" placeholder="예: 한국아파트 관리사무소" /></div>
      <div><label>연락처</label><input id="contact" placeholder="예: 010-0000-0000" /></div>
      <div><label>현장주소</label><input id="siteAddress" placeholder="예: 부천시 ..." /></div>
      <div><label>상담일자</label><input id="consultDate" type="date" /></div>
      <div><label>시공예정일</label><input id="workDate" type="date" /></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>자주 쓰는 품목 (클릭하면 아래 표에 추가됩니다)</legend>
    <div class="catalog" id="catalog"></div>
  </fieldset>

  <fieldset>
    <legend>견적 항목</legend>
    <table id="itemsTable">
      <thead>
        <tr><th>품명</th><th>규격</th><th>단위</th><th>수량</th><th>단가</th><th>금액</th><th></th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button class="add-row-btn" id="addRowBtn">+ 품목 직접 추가</button>
  </fieldset>

  <fieldset>
    <legend>요율</legend>
    <div style="display:flex; gap:24px;">
      <div class="rate-inline"><label style="margin:0">부가세</label><input id="vatRate" type="number" value="10" /> %</div>
      <div class="rate-inline"><label style="margin:0">계약금</label><input id="depositRate" type="number" value="50" /> %</div>
    </div>
  </fieldset>

  <div class="totals" id="totals"></div>

  <div class="actions">
    <button id="downloadBtn">엑셀 견적서 다운로드</button>
  </div>

  <div class="notes" id="notesArea"></div>

  <script src="app.js"></script>
</body>
</html>
